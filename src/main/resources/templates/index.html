<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Promptly AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div class="chat-card">

        <div class="chat-header">
            <h1>Promptly</h1>
            <select id="personality">
                <option value="assistant">Assistant</option>
                <option value="coder">Java developer</option>
                <option value="ron-burgundy">Ron Burgundy</option>
            </select>
            <button id="clearBtn" class="clear-btn">Clear</button>
        </div>

        <div id="chat-window" class="chat-window">
            <div class="message ai">Hello 👋 How can I help you?</div>
        </div>

        <div class="chat-input">
            <input id="messageInput" type="text" placeholder="Write a message...">
            <button id="sendBtn">Send</button>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
